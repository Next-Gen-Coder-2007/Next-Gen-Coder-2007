<svg width="900" height="140" viewBox="0 0 900 140"
xmlns="http://www.w3.org/2000/svg">

<style>
.text {
  font-family: monospace;
  font-size: 22px;
  fill: #00d1ff;
}

.sub {
  font-size: 14px;
  fill: #8be9fd;
}

.blink {
  animation: blink 1.2s infinite;
}

@keyframes blink {
  0%, 50%, 100% { opacity: 1; }
  25%, 75% { opacity: 0; }
}
</style>

<text x="40" y="55" class="text">SYSTEM STATUS: ONLINE</text>
<text x="40" y="90" class="sub">Full Stack Development Environment Initialized</text>

<text x="470" y="55" class="text">
  ▮
  <animate attributeName="opacity" dur="1s" repeatCount="indefinite"
           values="1;0;1"/>
</text>

</svg>
