<svg width="420" height="300" viewBox="0 0 420 300"
xmlns="http://www.w3.org/2000/svg">

<style>
.orbit {
  animation: spin 18s linear infinite;
  transform-origin: 210px 150px;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.tech {
  fill: #00d1ff;
  font-family: monospace;
  font-size: 13px;
}
</style>

<circle cx="210" cy="150" r="38" stroke="#00d1ff" fill="none"/>
<text x="210" y="155" text-anchor="middle" fill="#00d1ff" font-family="monospace">
STACK
</text>

<g class="orbit">
  <text x="210" y="25" class="tech">React</text>
  <text x="370" y="160" class="tech">Node</text>
  <text x="210" y="295" class="tech">MongoDB</text>
  <text x="40"  y="160" class="tech">Flask</text>
</g>

</svg>
